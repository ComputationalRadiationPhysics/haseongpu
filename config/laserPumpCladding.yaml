# Complete schema-v3 laserPumpCladding configuration for Simulation.fromYaml().
# Relative paths are resolved against this file. Unknown keys are rejected.
schema_version: 3

materials:
  yb_yag:
    # yb_yag is this file's local reference name. The HDF5 key selects the
    # database record, so callers may replace this alias through object injection.
    from_hdf5:
      path: ../material_library/data/materials.h5
      key: YbYAG
    # Canonical YAML units: K and m^-3.
    temperature: 293.15
    active_ion_density: 2.776e26
    interpolation: exact
    spectral_resolution: 1000
  cladding_glass:
    # Activity and the default absorption coefficient are material properties
    # stored in the HDF5 record. This passive material has no ion population.
    from_hdf5:
      path: ../material_library/data/materials.h5
      key: CladdingGlass
    temperature: 293.15
    interpolation: exact

topologies:
  amplifier_mesh:
    from_file:
      # Tet4 coordinates in this VTK file are in metres.
      path: ../example/data/ptTet4.vtk
      format: vtk

domains:
  amplifier_volume:
    from_gmsh:
      topology: amplifier_mesh
      physical_group: 1
      entity_kind: volume
  cladding_volume:
    from_gmsh:
      topology: amplifier_mesh
      physical_group: 2
      entity_kind: volume
  cladding_boundary:
    boundary: cladding_volume
  all_exterior:
    where:
      topology: amplifier_mesh
      entity_kind: surface
      selector: all_exterior
  ase_bottom:
    where:
      topology: amplifier_mesh
      entity_kind: surface
      selector: z_min
  ase_top:
    where:
      topology: amplifier_mesh
      entity_kind: surface
      selector: z_max
  pump_input:
    # Remove bottom faces owned by the radial cladding shell.
    difference: [ase_bottom, cladding_boundary]
  pump_exit:
    difference: [ase_top, cladding_boundary]
  end_surfaces:
    union: [ase_bottom, ase_top]
  cladding_surface:
    difference: [all_exterior, end_surfaces]

optical_components:
  crystal:
    domain: amplifier_volume
    material: yb_yag
    surface_optics:
      - domain: pump_input
        reflectivity: 0.0
        interior_refractive_index: 1.83
        exterior_refractive_index: 1.0
      - domain: pump_exit
        reflectivity: 0.0
        interior_refractive_index: 1.83
        exterior_refractive_index: 1.0
  cladding:
    domain: cladding_volume
    material: cladding_glass
    surface_optics:
      - domain: cladding_surface
        reflectivity: 0.0
        interior_refractive_index: 1.45
        exterior_refractive_index: 1.0

gain_media:
  amplifier:
    components: [crystal]

simulation:
  optical_components: [crystal, cladding]
  gain_medium: amplifier
  initial_excitation:
    value: 0.0

  # Material spectra are authoritative for ASE and pump transport.
  phi_ase:
    ase_steps: 150
    propagation_mode: forward
    min_rays: 100000
    max_rays: 1000000
    relative_standard_error_threshold: 0.1
    track_ray_visits: false
    repetitions: 4
    adaptive_steps: 2 # first run with 100K - second with 1M rays
    use_reflections: true
    reflection_max_iterations: 40
    reflection_tolerance: 1.0e-4
    monochromatic: false
    backend: Host_Cpu_CpuOmpBlocks
    openpmd_backend: auto
    parallel_mode: single
    num_devices: 1
    n_per_node: 1

  pumps:
    - total_power: 110127.28516598798
      ray_count: 50000
      pump_steps: 50
      rng_seed: 5489
      spectrum:
        # Pump wavelength in metres.
        monochromatic: 9.40e-7
      angular_distribution:
        collimated: {}
      profile:
        kind: super_gaussian
        radius_u: 0.015
        radius_v: 0.015
        exponent: 40
        center: [0.0, 0.0, 0.0]
        axis_u: [1.0, 0.0, 0.0]
        axis_v: [0.0, 1.0, 0.0]
      injection:
        domain: pump_input
      relays:
        - exit_domain: pump_exit
          entry_domain: pump_exit
          flip_u: false
          flip_v: false
          rotation: 0.0
          offset: [0.0, 0.0]
          tilt: [0.0, 0.0]
          magnification: 1.0
          transmission: 1.0

  time_integrator:
    method: frozen_phi_ase_runge_kutta4
  # Seconds per step.
  time_step_size: 2.0e-5
  simulation_steps: 150
  pre_pump: true
  report_timings: false
  execution_mode: autonomous
  output_steps: null
  output_fields:
    - beta_volume
    - phi_ase
    - standard_error
    - relative_standard_error
    - total_rays
    - dndt_ase
    - dndt_pump
  control_fields: []
