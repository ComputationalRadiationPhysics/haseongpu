# Keep the root pipeline small.  As in Alpaka's GitLab CI, this job generates
# focused child pipelines and the trigger jobs execute them independently.
stages:
  - generator
  - run-test-jobs

generate:
  stage: generator
  image: python:3.14-alpine
  script:
    - python3 script/ci/generate-gitlab.py
    - cat compile_only.yml
    - cat runtime_cpu.yml
    - cat runtime_gpu.yml
  artifacts:
    paths:
      - compile_only.yml
      - runtime_cpu.yml
      - runtime_gpu.yml
    expire_in: 1 week
  interruptible: true
  tags:
    - hifis-linux-small-amd64

run-compile-only-test:
  stage: run-test-jobs
  trigger:
    include:
      - artifact: compile_only.yml
        job: generate
    strategy: depend

run-runtime-cpu-test:
  stage: run-test-jobs
  trigger:
    include:
      - artifact: runtime_cpu.yml
        job: generate
    strategy: depend

run-runtime-gpu-test:
  stage: run-test-jobs
  rules:
    - if: '$HASE_CI_GPU_RUNTIME == "1"'
    - when: manual
      allow_failure: true
  trigger:
    include:
      - artifact: runtime_gpu.yml
        job: generate
    strategy: depend
